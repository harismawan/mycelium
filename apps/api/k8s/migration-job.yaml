apiVersion: batch/v1
kind: Job
metadata:
  name: mycelium-migrate
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-1"
spec:
  ttlSecondsAfterFinished: 600
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: mycelium-migrate
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-creds
      containers:
        - name: migrate
          image: ghcr.io/harismawan/mycelium-api
          imagePullPolicy: IfNotPresent
          command: ["bunx", "prisma", "migrate", "deploy"]
          workingDir: /app/apps/api
          envFrom:
            - secretRef:
                name: mycelium-secrets
